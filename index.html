<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Праздничный дурдом — какой сегодня смешной праздник?</title>
  <meta name="description" content="Календарь настоящих смешных, странных и локальных праздников на каждый день: День сурка, Ла Томатина, День туалета и ещё двести поводов." />
  <meta name="theme-color" content="#fdf4e6" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A4%A1%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <button class="brand" id="today-btn" title="К сегодняшнему дню">
        <span class="brand-logo" aria-hidden="true">🤡</span>
        <span>
          <span class="brand-name">Праздничный дурдом</span>
          <span class="brand-tag">какой сегодня смешной праздник</span>
        </span>
      </button>

      <nav class="nav" aria-label="Основные действия">
        <button class="nav-btn" id="random-btn" title="Случайный праздник">🎲 Случайный</button>
        <button class="nav-btn" id="fav-toggle" title="Показать избранное">
          <span class="heart-glyph" aria-hidden="true">♡</span> Избранное <span class="fav-count" id="fav-count">0</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="wrap">

    <section class="hero" id="hero" aria-label="Праздник выбранного дня"></section>

    <section class="upcoming" id="upcoming" aria-label="Ближайшие праздники"></section>

    <section class="calendar-card" id="calendar" aria-label="Календарь на месяц"></section>

    <section class="explore" id="explore" aria-label="Все праздники"></section>

  </main>

  <footer class="foot">
    <div class="foot-inner">
      <div>
        <div class="foot-emoji" aria-hidden="true">🤡 🎈 🥒 🚽</div>
        <div class="foot-note">
          Только настоящие праздники: международные дни ООН, национальные поводы и локальные
          фестивали. Даты «плавающих» праздников пересчитываются для текущего года.
        </div>
      </div>
      <div class="foot-note">
        Праздничный дурдом · сделано ради повода
      </div>
    </div>
  </footer>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <div style="max-width:640px;margin:40px auto;padding:24px;border:2.5px solid #17171f;border-radius:20px;background:#fff">
      Для календаря нужен JavaScript — включите его, и праздники появятся.
    </div>
  </noscript>

  <script src="data/holidays-1.js"></script>
  <script src="data/holidays-2.js"></script>
  <script src="data/holidays-3.js"></script>
  <script src="data/holidays-4.js"></script>
  <script src="app.js"></script>
</body>
</html>
